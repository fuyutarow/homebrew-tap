name: Update agx and semlint formulas

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      tool:
        description: Formula to update
        required: false
        type: choice
        options:
          - all
          - agx
          - semlint
        default: all

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha
      - name: Update and publish formulas
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_TOOL: ${{ github.event.inputs.tool || 'all' }}
        run: |
          set -euo pipefail
          if [[ "$SELECTED_TOOL" == all ]]; then
            tools=(agx semlint)
          else
            tools=("$SELECTED_TOOL")
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          for tool in "${tools[@]}"; do
            if result=$(scripts/update-formula.sh "$tool" 2>"$error_file"); then
              :
            else
              status=$?
              if [[ "$status" == 3 ]]; then
                cat "$error_file" >&2
                echo "::warning::Skipping $tool because its latest release cannot be read with this repository token."
                continue
              fi
              cat "$error_file" >&2
              exit "$status"
            fi
            printf '%s: %s\n' "$tool" "$result"
            version=${result#* }
            if ! git diff --quiet -- "Formula/$tool.rb"; then
              git add "Formula/$tool.rb"
              git commit -m "$tool $version"
              git push origin HEAD:alpha
            fi
          done
